<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — The Mafé Ensemble</title>
  <meta name="description" content="Thank you for contacting The Mafé Ensemble.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0A0A0A;
      --white: #FFFFFF;
      --terracotta: #C75B2E;
      --gray-600: #666666;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .success-container {
      max-width: 500px;
    }
    .success-icon {
      font-size: 4rem;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 300;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--gray-600);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      padding: 16px 36px;
      background: var(--terracotta);
      color: var(--white);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 0.3s;
    }
    a:hover {
      background: #d4724a;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-icon">🥁</div>
    <h1>Message Received!</h1>
    <p>Thank you for reaching out. We'll get back to you within 24-48 hours about your inquiry.</p>
    <a href="/">Back to Website</a>
  </div>
</body>
</html>
